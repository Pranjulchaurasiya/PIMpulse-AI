<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; display: block; border-radius: 12px;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0c192c"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="220" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Subtle Background Grid Lines -->
  <path d="M 0 50 L 1000 50 M 0 100 L 1000 100 M 0 150 L 1000 150 M 0 200 L 1000 200" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 200 0 L 200 220 M 400 0 L 400 220 M 600 0 L 600 220 M 800 0 L 800 220" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Glowing Accent Wave -->
  <path d="M 0 180 Q 250 140, 500 180 T 1000 160 L 1000 220 L 0 220 Z" fill="url(#accentGrad)" opacity="0.15" />

  <!-- Logo Icon & Brand Title -->
  <g transform="translate(50, 45)">
    <!-- Bolt Badge Circle -->
    <rect width="48" height="48" rx="12" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="24" y="32" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, sans-serif">⚡</text>

    <!-- Main Title -->
    <text x="65" y="34" font-size="34" font-weight="800" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-0.5">PIMpulse AI</text>
    
    <!-- Track Tag (Cleanly Spaced at x=285) -->
    <rect x="285" y="12" width="120" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="345" y="28" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" font-family="monospace" letter-spacing="0.5">UniHack 2026</text>
  </g>

  <!-- Subtitle -->
  <text x="50" y="125" font-size="16" font-weight="600" fill="#94a3b8" font-family="system-ui, sans-serif">Autonomous Enterprise Product Enrichment &amp; MDM Delivery Engine</text>

  <!-- Bottom Key Metric Pills -->
  <g transform="translate(50, 155)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
    <text x="28" y="19" font-size="11" font-weight="600" fill="#e2e8f0" font-family="system-ui, sans-serif">Unilog 252-Column Standard</text>

    <!-- Pill 2 -->
    <rect x="232" y="0" width="210" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="247" cy="15" r="4" fill="#10b981"/>
    <text x="260" y="19" font-size="11" font-weight="600" fill="#e2e8f0" font-family="system-ui, sans-serif">190.2 SKUs/sec SIMD Speed</text>

    <!-- Pill 3 -->
    <rect x="454" y="0" width="210" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="469" cy="15" r="4" fill="#a855f7"/>
    <text x="482" y="19" font-size="11" font-weight="600" fill="#e2e8f0" font-family="system-ui, sans-serif">Verbatim OEM Grounding</text>

    <!-- Pill 4 -->
    <rect x="676" y="0" width="224" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="691" cy="15" r="4" fill="#f59e0b"/>
    <text x="704" y="19" font-size="11" font-weight="600" fill="#e2e8f0" font-family="system-ui, sans-serif">100% Invariants Validation</text>
  </g>
</svg>
