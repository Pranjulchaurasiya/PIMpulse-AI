services:
  - type: web
    name: pimpulse-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
