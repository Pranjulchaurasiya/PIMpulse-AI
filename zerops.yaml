# Zerops deployment configuration for PIMpulse AI
zerops:
  - setup: pimpulseai
    build:
      base: python@3.11
      buildCommands:
        - python -m venv .venv
        - ./.venv/bin/pip install --upgrade pip
        - ./.venv/bin/pip install -r requirements.txt
      deployFiles:
        - .venv
        - agents
        - data
        - llm
        - rules
        - static
        - main.py
        - config.py
        - state.py
        - cache.py
        - graph.py
        - requirements.txt
        - PIMpulse_Unilog_Enriched_1000.xlsx
        - PIMpulse_Unilog_Enriched_1000.csv
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: ./.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
      envVariables:
        PORT: 8000
        HOST: 0.0.0.0
