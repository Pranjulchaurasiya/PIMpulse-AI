# Zerops deployment configuration for PIMpulse AI
zerops:
  - setup: pimpulse-ai
    build:
      base: python@3.11
      buildCommands:
        - pip install -r requirements.txt
      deployFiles:
        - .
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn main:app --host 0.0.0.0 --port 8000
      envVariables:
        PROVIDER: groq
        PORT: 8000
        HOST: 0.0.0.0
